; OPcache: compila y cachea el bytecode PHP en memoria. Baja notablemente el
; tiempo de PHP por request y acelera el arranque tras un cold start de Render.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; La imagen se reconstruye en cada deploy; el código no cambia en caliente, así
; que no hace falta revalidar por timestamp (ahorra un stat() por archivo).
opcache.validate_timestamps=0
opcache.save_comments=1
