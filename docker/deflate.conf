# Compresión gzip de las respuestas de texto (JSON sobre todo). El listado de
# confirmandos pasa de ~450 kB a ~40 kB en la red — clave para los usuarios en
# datos móviles.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/json
    AddOutputFilterByType DEFLATE application/javascript application/x-javascript text/javascript
    AddOutputFilterByType DEFLATE text/css text/html text/plain text/xml
    AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>
